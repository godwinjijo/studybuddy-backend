spring:
  application:
    name: studybuddy-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/studybuddy_dev
    username: studybuddy_app
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.studybuddy.backend: DEBUG